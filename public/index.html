<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Studio — AI song generator</title>
  <meta name="description" content="Describe a song and get original AI-generated music in minutes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">♪</span> Music Studio</div>
    <div class="credits" id="credits" title="Remaining API credits">…</div>
  </header>

  <main class="layout">
    <section class="panel create">
      <h1>Make a song</h1>
      <p class="sub">Describe it, pick a vibe, and get two original tracks.</p>

      <div class="tabs" role="tablist">
        <button class="tab active" data-mode="simple" role="tab" aria-selected="true">Simple</button>
        <button class="tab" data-mode="custom" role="tab" aria-selected="false">Custom</button>
      </div>

      <form id="form" autocomplete="off">
        <div class="mode simple-only">
          <label for="prompt">Song description</label>
          <textarea id="prompt" maxlength="3000" rows="4"
            placeholder="An upbeat summer pop song about road trips with friends"></textarea>
          <div class="chips" id="ideas"></div>
        </div>

        <div class="mode custom-only" hidden>
          <label for="title">Title</label>
          <input id="title" maxlength="80" placeholder="Midnight Drive" />

          <label for="lyrics" class="vocal-only">Lyrics</label>
          <textarea id="lyrics" class="vocal-only" maxlength="5000" rows="8"
            placeholder="[Verse]&#10;City lights are calling my name&#10;&#10;[Chorus]&#10;..."></textarea>
        </div>

        <label for="style">Style <span class="hint">genres, moods, instruments</span></label>
        <input id="style" maxlength="1000" placeholder="synthwave, dreamy, female vocals, 110 bpm" />
        <div class="chips" id="styles"></div>

        <details class="mode custom-only advanced" hidden>
          <summary>Advanced</summary>
          <label for="negativeTags">Avoid</label>
          <input id="negativeTags" maxlength="1000" placeholder="heavy metal, screaming" />

          <div class="row">
            <div class="vocal-only">
              <label for="vocalGender">Voice</label>
              <select id="vocalGender">
                <option value="">Any</option>
                <option value="f">Female</option>
                <option value="m">Male</option>
              </select>
            </div>
            <div>
              <label for="variety">Variety</label>
              <select id="variety">
                <option value="0">Off</option>
                <option value="1" selected>Normal</option>
                <option value="2">High</option>
                <option value="3">Extra</option>
                <option value="4">Max</option>
              </select>
            </div>
          </div>

          <label for="duration">Length <span class="hint" id="durationOut">auto</span></label>
          <input type="range" id="duration" min="0" max="360" step="10" value="0" />

          <label for="styleWeight">Style adherence <span class="hint" id="styleWeightOut">default</span></label>
          <input type="range" id="styleWeight" min="-0.01" max="1" step="0.01" value="-0.01" />

          <label for="weirdness">Weirdness <span class="hint" id="weirdnessOut">default</span></label>
          <input type="range" id="weirdness" min="-0.01" max="1" step="0.01" value="-0.01" />
        </details>

        <div class="row controls">
          <label class="switch">
            <input type="checkbox" id="instrumental" />
            <span class="slider"></span>
            Instrumental
          </label>
          <select id="model" aria-label="Model">
            <option value="V6" selected>V6 · best quality</option>
            <option value="V6_WILD">V6 Wild · experimental</option>
            <option value="V6_MINI">V6 Mini · fastest</option>
          </select>
        </div>

        <button type="submit" class="primary" id="submit">
          <span class="btn-label">Generate</span>
        </button>
        <p class="error" id="error" role="alert" hidden></p>
      </form>
    </section>

    <section class="panel library">
      <div class="library-head">
        <h2>Your tracks</h2>
        <button class="ghost small" id="clear" hidden>Clear history</button>
      </div>
      <div id="tracks" class="tracks">
        <div class="empty" id="empty">
          <div class="empty-icon">🎧</div>
          <p>Your songs will show up here.<br />Generation usually takes 1–3 minutes.</p>
        </div>
      </div>
    </section>
  </main>

  <div class="player" id="player" hidden>
    <img id="playerArt" alt="" />
    <div class="player-meta">
      <div id="playerTitle" class="player-title"></div>
      <div id="playerTags" class="player-tags"></div>
    </div>
    <audio id="audio" controls preload="none"></audio>
  </div>

  <template id="jobTpl">
    <article class="job">
      <div class="job-head">
        <div>
          <div class="job-title"></div>
          <div class="job-status"><span class="dot"></span><span class="status-text"></span></div>
        </div>
        <button class="ghost small remove" title="Remove">✕</button>
      </div>
      <div class="job-tracks"></div>
    </article>
  </template>

  <template id="trackTpl">
    <div class="track">
      <button class="art" aria-label="Play">
        <img alt="" loading="lazy" />
        <span class="play-icon">▶</span>
      </button>
      <div class="track-info">
        <div class="track-title"></div>
        <div class="track-tags"></div>
        <div class="track-actions">
          <span class="track-duration"></span>
          <a class="download" download target="_blank" rel="noopener">Download</a>
          <button class="ghost small lyrics-btn">Lyrics</button>
        </div>
        <pre class="track-lyrics" hidden></pre>
      </div>
    </div>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
